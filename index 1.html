<!doctype html><html lang="af"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kersfees Spook</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#124331,#061d17 72%);color:#fff7df;font-family:system-ui,sans-serif}main{text-align:center;width:min(94vw,740px);padding:20px}h1{color:#ffd166;font-size:clamp(2.3rem,7vw,4.5rem);margin:.1em 0}.mode{display:inline-block;padding:8px 14px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff44;font-weight:800;margin-bottom:16px}.mode.fixed{background:#ffd166;color:#201800}.wrap{position:relative;width:min(82vw,560px);aspect-ratio:1;margin:auto;filter:drop-shadow(0 18px 28px #0008)}canvas{width:100%;height:100%;display:block}.pointer{position:absolute;z-index:2;left:50%;top:-3px;transform:translateX(-50%);border-left:23px solid transparent;border-right:23px solid transparent;border-top:54px solid #ffd166}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;background:#fff7df;border:8px solid #ffd166}button{border:0;border-radius:999px;padding:13px 34px;background:#ffd166;color:#153025;font-weight:800;font-size:1.1rem;cursor:pointer}#spin{margin-top:22px;box-shadow:0 7px 0 #ae7d14}#result{min-height:2em;color:#ffd166;font-size:1.8rem;font-weight:800;margin-top:18px}#admin{position:fixed;right:14px;bottom:14px;width:48px;height:48px;padding:0;background:#061d17dd;color:white;border:1px solid #ffffff55}dialog{width:min(92vw,550px);border:1px solid #ffffff44;border-radius:16px;background:#102b22;color:white;padding:22px}dialog::backdrop{background:#000b}label{display:block;font-weight:800;margin:14px 0 6px}textarea,select,input{width:100%;padding:10px;border:1px solid #ffffff44;border-radius:9px;background:#061d17;color:white;font:inherit}textarea{height:160px}.radios label{display:inline-block;margin-right:18px;font-weight:600}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.actions button{font-size:1rem;padding:9px 17px}.secondary{background:#ffffff22;color:white}.note{font-size:.87rem;opacity:.8}.warn{color:#ffd166;font-weight:700}
</style></head><body><main><h1>Kersfees Spook</h1><p>Klik om die wiel te draai</p><div id="mode" class="mode">Modus: Willekeurig</div><div class="wrap"><div class="pointer"></div><canvas id="wheel" width="800" height="800"></canvas><div class="hub"></div></div><button id="spin">DRAAI</button><div id="result" aria-live="polite"></div></main><button id="admin" title="Administrasie">⚙️</button>
<dialog id="passDlg"><form id="passForm"><h2>Administrateur</h2><label for="pass">Wagwoord</label><input id="pass" type="password" required><p id="passMsg" class="warn"></p><div class="actions"><button type="button" class="secondary" data-close="passDlg">Kanselleer</button><button>Gaan voort</button></div></form></dialog>
<dialog id="settingsDlg"><form id="settingsForm"><h2>Wiel-instellings</h2><label for="names">Name, een per reël</label><textarea id="names"></textarea><label>Keusemodus</label><div class="radios"><label><input type="radio" name="pickMode" value="random"> Willekeurig</label><label><input type="radio" name="pickMode" value="fixed"> Vaste wenner</label></div><label for="winner">Vaste wenner</label><select id="winner"></select><p class="note">In vaste modus sien deelnemers slegs dat die uitslag vooraf ingestel is. Die gekose naam is net hier in die administrasiepaneel sigbaar.</p><p id="setMsg" class="warn"></p><div class="actions"><button type="button" class="secondary" data-close="settingsDlg">Kanselleer</button><button>Stoor</button></div></form></dialog>
<script>
'use strict';const DEF={names:['Ma','Pa','Monica','Tertius','Thinus','Stephanie'],mode:'random',winner:'Stephanie'},KEY='kersfeesSpookSettings',PASSWORD='Kersfees2026',COL=['#d1495b','#1f7a5a','#e6a23c','#2c6e99','#8f5aa8','#3a9d8f'];let s=load(),angle=0,busy=false;const $=id=>document.getElementById(id),c=$('wheel'),x=c.getContext('2d');function norm(a){let z=new Set;return a.map(v=>v.trim()).filter(v=>v&&!z.has(v.toLowerCase())&&z.add(v.toLowerCase()))}function load(){try{let q=JSON.parse(localStorage.getItem(KEY));if(!q)return structuredClone(DEF);q.names=norm(q.names||[]);if(q.names.length<2)return structuredClone(DEF);q.mode=q.mode==='fixed'?'fixed':'random';q.winner=q.names.includes(q.winner)?q.winner:q.names[0];return q}catch{return structuredClone(DEF)}}function save(){localStorage.setItem(KEY,JSON.stringify(s))}function indicator(){$('mode').textContent=s.mode==='fixed'?'Modus: Vooraf ingestelde verrassingsuitslag':'Modus: Willekeurig';$('mode').classList.toggle('fixed',s.mode==='fixed')}function draw(){let n=s.names.length,a=2*Math.PI/n,m=400,r=382;x.clearRect(0,0,800,800);x.save();x.translate(m,m);x.rotate(angle);s.names.forEach((name,i)=>{let st=i*a-Math.PI/2;x.beginPath();x.moveTo(0,0);x.arc(0,0,r,st,st+a);x.closePath();x.fillStyle=COL[i%COL.length];x.fill();x.strokeStyle='#fff7df';x.lineWidth=6;x.stroke();x.save();x.rotate(st+a/2);x.textAlign='right';x.textBaseline='middle';x.fillStyle='white';x.font='700 38px system-ui';x.fillText(name,r-42,0,r*.72);x.restore()});x.beginPath();x.arc(0,0,r,0,2*Math.PI);x.strokeStyle='#ffd166';x.lineWidth=18;x.stroke();x.restore()}function target(){if(s.mode==='fixed')return Math.max(0,s.names.indexOf(s.winner));let u=new Uint32Array(1);crypto.getRandomValues(u);return u[0]%s.names.length}function spin(){if(busy)return;busy=true;$('spin').disabled=true;$('result').textContent='';let i=target(),a=2*Math.PI/s.names.length,cur=((angle%(2*Math.PI))+2*Math.PI)%(2*Math.PI),want=-(i+.5)*a,d=((want-cur)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)+14*Math.PI,start=angle,t0=performance.now();function f(t){let p=Math.min(1,(t-t0)/4200);angle=start+d*(1-Math.pow(1-p,4));draw();if(p<1)requestAnimationFrame(f);else{busy=false;$('spin').disabled=false;$('result').textContent='🎄 '+s.names[i]+'! 🎄'}}requestAnimationFrame(f)}function options(selected){let a=norm($('names').value.split(/\r?\n/));$('winner').innerHTML='';a.forEach(n=>{let o=document.createElement('option');o.value=o.textContent=n;o.selected=n===selected;$('winner').append(o)})}$('spin').onclick=spin;$('admin').onclick=()=>{$('pass').value='';$('passMsg').textContent='';$('passDlg').showModal()};$('passForm').onsubmit=e=>{e.preventDefault();if($('pass').value!==PASSWORD){$('passMsg').textContent='Verkeerde wagwoord.';return}$('passDlg').close();$('names').value=s.names.join('\n');document.querySelector(`[name=pickMode][value=${s.mode}]`).checked=true;options(s.winner);$('settingsDlg').showModal()};$('names').oninput=()=>options($('winner').value);$('settingsForm').onsubmit=e=>{e.preventDefault();let names=norm($('names').value.split(/\r?\n/));if(names.length<2){$('setMsg').textContent='Voer ten minste twee unieke name in.';return}let mode=document.querySelector('[name=pickMode]:checked').value,winner=names.includes($('winner').value)?$('winner').value:names[0];s={names,mode,winner};save();angle=0;$('result').textContent='';indicator();draw();$('settingsDlg').close()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());indicator();draw();
</script></body></html>
