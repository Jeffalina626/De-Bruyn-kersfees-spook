<!doctype html>
<html lang="af">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3024">
  <title>Kersfees Spook</title>
  <style>
    :root {
      --bg-dark: #071f19;
      --bg-light: #123f2f;
      --gold: #ffd166;
      --cream: #fff7df;
      --red: #d1495b;
      --panel: #102b22;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--cream);
      background: radial-gradient(circle at top, var(--bg-light), var(--bg-dark) 72%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .snow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 28px 28px;
    }

    main {
      width: min(94vw, 760px);
      padding: 24px;
      text-align: center;
    }

    h1 {
      margin: .1em 0 .15em;
      color: var(--gold);
      font-size: clamp(2.2rem, 7vw, 4.5rem);
      text-shadow: 0 4px 18px #000;
    }

    .subtitle { margin: 0 0 10px; opacity: .82; }

    #modeIndicator {
      display: inline-block;
      margin: 0 0 18px;
      padding: 8px 15px;
      border: 1px solid #ffffff40;
      border-radius: 999px;
      background: #ffffff12;
      font-weight: 800;
    }

    #modeIndicator.fixed {
      color: #241b00;
      background: var(--gold);
      border-color: var(--gold);
    }

    .wheel-wrap {
      position: relative;
      width: min(82vw, 560px);
      aspect-ratio: 1;
      margin: auto;
      filter: drop-shadow(0 18px 28px #0008);
    }

    canvas { width: 100%; height: 100%; display: block; }

    .pointer {
      position: absolute;
      z-index: 3;
      top: -4px;
      left: 50%;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-top: 56px solid var(--gold);
      border-right: 24px solid transparent;
      border-left: 24px solid transparent;
      filter: drop-shadow(0 3px 2px #0008);
    }

    .hub {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 72px;
      height: 72px;
      transform: translate(-50%, -50%);
      border: 8px solid var(--gold);
      border-radius: 50%;
      background: var(--cream);
      box-shadow: 0 3px 10px #0008;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 42px;
      color: #173226;
      background: linear-gradient(#ffe49a, var(--gold));
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
    }

    #spinButton {
      margin-top: 24px;
      box-shadow: 0 8px 0 #b48117, 0 14px 28px #0007;
    }

    #spinButton:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #b48117;
    }

    button:disabled { opacity: .6; cursor: not-allowed; }

    #result {
      min-height: 2.2em;
      margin-top: 18px;
      color: var(--gold);
      font-size: clamp(1.4rem, 4vw, 2.1rem);
      font-weight: 800;
    }

    #adminButton {
      position: fixed;
      right: 15px;
      bottom: 15px;
      z-index: 10;
      width: 50px;
      height: 50px;
      padding: 0;
      border: 1px solid #ffffff55;
      border-radius: 50%;
      color: #fff;
      background: #071f19dd;
      font-size: 1.35rem;
      opacity: .65;
      box-shadow: 0 6px 20px #0008;
    }

    #adminButton:hover { opacity: 1; }

    dialog {
      width: min(92vw, 560px);
      max-height: 90vh;
      overflow: auto;
      padding: 24px;
      border: 1px solid #ffffff33;
      border-radius: 18px;
      color: #fff;
      background: var(--panel);
      box-shadow: 0 24px 80px #000c;
    }

    dialog::backdrop { background: #000b; }

    .settings { text-align: left; }
    .settings h2 { margin-top: 0; color: var(--gold); }
    .settings label { display: block; margin: 16px 0 6px; font-weight: 800; }

    textarea, select, input[type="password"] {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ffffff44;
      border-radius: 10px;
      color: #fff;
      background: #071f19;
      font: inherit;
    }

    textarea {
      min-height: 165px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .mode-options {
      display: grid;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid #ffffff33;
      border-radius: 10px;
      background: #ffffff08;
    }

    .mode-options label { margin: 0; font-weight: 600; }
    .mode-options input { margin-right: 8px; }
    .help { font-size: .87rem; opacity: .75; }
    .warning { color: var(--gold); font-weight: 700; }

    .dialog-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .dialog-actions button {
      padding: 10px 20px;
      font-size: 1rem;
      box-shadow: none;
    }

    .secondary { color: #fff; background: #ffffff20; }
    .danger { color: #fff; background: var(--red); }

    @media (max-width: 520px) {
      main { padding: 16px 12px 78px; }
      .hub { width: 58px; height: 58px; border-width: 7px; }
      .pointer { border-top-width: 46px; border-right-width: 20px; border-left-width: 20px; }
    }
  </style>
</head>
<body>
  <div class="snow" aria-hidden="true"></div>

  <main>
    <h1>Kersfees Spook</h1>
    <p class="subtitle">Klik om die wiel te draai</p>
    <div id="modeIndicator" role="status">Modus: Willekeurig</div>

    <div class="wheel-wrap">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel" width="800" height="800" aria-label="Kersfees Spook-keusewiel"></canvas>
      <div class="hub" aria-hidden="true"></div>
    </div>

    <button id="spinButton" type="button">DRAAI</button>
    <div id="result" aria-live="polite"></div>
  </main>

  <button id="adminButton" type="button" aria-label="Maak administrasiepaneel oop" title="Administrasie">⚙️</button>

  <dialog id="passwordDialog">
    <form id="passwordForm" class="settings">
      <h2>Administrateur</h2>
      <label for="passwordInput">Wagwoord</label>
      <input id="passwordInput" type="password" autocomplete="current-password" required>
      <p id="passwordMessage" class="warning" aria-live="polite"></p>
      <div class="dialog-actions">
        <button id="cancelPassword" class="secondary" type="button">Kanselleer</button>
        <button type="submit">Gaan voort</button>
      </div>
    </form>
  </dialog>

  <dialog id="adminDialog">
    <form id="adminForm" class="settings">
      <h2>Wiel-instellings</h2>

      <label for="namesInput">Name, een per reël</label>
      <textarea id="namesInput" spellcheck="false"></textarea>
      <p class="help">Ten minste twee unieke name word vereis.</p>

      <label>Keusemodus</label>
      <div class="mode-options">
        <label><input type="radio" name="mode" value="random"> Willekeurig</label>
        <label><input type="radio" name="mode" value="fixed"> Vaste wenner</label>
      </div>

      <label for="winnerSelect">Vaste wenner</label>
      <select id="winnerSelect"></select>
      <p class="help">Wanneer Vaste wenner gekies is, word die modus en wenner duidelik bo die wiel vertoon.</p>

      <p id="adminMessage" class="warning" aria-live="polite"></p>

      <div class="dialog-actions">
        <button id="resetButton" class="danger" type="button">Herstel</button>
        <button id="cancelAdmin" class="secondary" type="button">Kanselleer</button>
        <button type="submit">Stoor</button>
      </div>
    </form>
  </dialog>

  <script>
    "use strict";

    const DEFAULTS = {
      names: ["Ma", "Pa", "Monica", "Tertius", "Thinus", "Stephanie"],
      mode: "random",
      fixedWinner: "Stephanie"
    };

    // This is a convenience gate only. A password embedded in front-end code is not secure.
    const ADMIN_PASSWORD = "Kersfees2026";
    const STORAGE_KEY = "kersfeesSpookTransparentSettings";
    const COLORS = ["#d1495b", "#1f7a5a", "#e6a23c", "#2c6e99", "#8f5aa8", "#3a9d8f"];

    const wheel = document.getElementById("wheel");
    const ctx = wheel.getContext("2d");
    const spinButton = document.getElementById("spinButton");
    const result = document.getElementById("result");
    const modeIndicator = document.getElementById("modeIndicator");
    const adminButton = document.getElementById("adminButton");

    const passwordDialog = document.getElementById("passwordDialog");
    const passwordForm = document.getElementById("passwordForm");
    const passwordInput = document.getElementById("passwordInput");
    const passwordMessage = document.getElementById("passwordMessage");
    const cancelPassword = document.getElementById("cancelPassword");

    const adminDialog = document.getElementById("adminDialog");
    const adminForm = document.getElementById("adminForm");
    const namesInput = document.getElementById("namesInput");
    const winnerSelect = document.getElementById("winnerSelect");
    const adminMessage = document.getElementById("adminMessage");
    const cancelAdmin = document.getElementById("cancelAdmin");
    const resetButton = document.getElementById("resetButton");

    let settings = loadSettings();
    let angle = 0;
    let spinning = false;

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved || !Array.isArray(saved.names) || saved.names.length < 2) return structuredClone(DEFAULTS);

        const names = normalizeNames(saved.names);
        const mode = saved.mode === "fixed" ? "fixed" : "random";
        const fixedWinner = names.includes(saved.fixedWinner) ? saved.fixedWinner : names[0];
        return { names, mode, fixedWinner };
      } catch {
        return structuredClone(DEFAULTS);
      }
    }

    function saveSettings() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
    }

    function normalizeNames(values) {
      const seen = new Set();
      return values
        .map(value => String(value).trim())
        .filter(value => value && !seen.has(value.toLocaleLowerCase()) && seen.add(value.toLocaleLowerCase()));
    }

    function updateModeIndicator() {
      if (settings.mode === "fixed") {
        modeIndicator.textContent = `Modus: Vaste wenner (${settings.fixedWinner})`;
        modeIndicator.classList.add("fixed");
      } else {
        modeIndicator.textContent = "Modus: Willekeurig";
        modeIndicator.classList.remove("fixed");
      }
    }

    function drawWheel() {
      const names = settings.names;
      const count = names.length;
      const arc = Math.PI * 2 / count;
      const center = wheel.width / 2;
      const radius = center - 18;
      const fontSize = Math.max(24, Math.min(39, 250 / Math.max(1, Math.log2(count))));

      ctx.clearRect(0, 0, wheel.width, wheel.height);
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(angle);

      for (let index = 0; index < count; index++) {
        const start = index * arc - Math.PI / 2;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, start, start + arc);
        ctx.closePath();
        ctx.fillStyle = COLORS[index % COLORS.length];
        ctx.fill();
        ctx.strokeStyle = "#fff7df";
        ctx.lineWidth = 6;
        ctx.stroke();

        ctx.save();
        ctx.rotate(start + arc / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#fff";
        ctx.font = `700 ${fontSize}px system-ui`;
        ctx.shadowColor = "#0009";
        ctx.shadowBlur = 5;
        ctx.fillText(names[index], radius - 42, 0, radius * .72);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.strokeStyle = "#ffd166";
      ctx.lineWidth = 18;
      ctx.stroke();
      ctx.restore();
    }

    function easeOutQuart(value) {
      return 1 - Math.pow(1 - value, 4);
    }

    function chooseWinnerIndex() {
      if (settings.mode === "fixed") {
        const fixedIndex = settings.names.indexOf(settings.fixedWinner);
        return fixedIndex >= 0 ? fixedIndex : 0;
      }

      const randomArray = new Uint32Array(1);
      crypto.getRandomValues(randomArray);
      return randomArray[0] % settings.names.length;
    }

    function spin() {
      if (spinning || settings.names.length < 2) return;

      spinning = true;
      spinButton.disabled = true;
      result.textContent = "";

      const count = settings.names.length;
      const arc = Math.PI * 2 / count;
      const targetIndex = chooseWinnerIndex();
      const current = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const desired = -(targetIndex + .5) * arc;
      const extraTurns = 6 + Math.floor(Math.random() * 3);
      const delta = ((desired - current) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) + Math.PI * 2 * extraTurns;
      const startAngle = angle;
      const duration = 4400;
      const startTime = performance.now();

      function animate(now) {
        const progress = Math.min(1, (now - startTime) / duration);
        angle = startAngle + delta * easeOutQuart(progress);
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          spinning = false;
          spinButton.disabled = false;
          result.textContent = `🎄 ${settings.names[targetIndex]}! 🎄`;
        }
      }

      requestAnimationFrame(animate);
    }

    function refreshWinnerOptions(selectedName) {
      winnerSelect.innerHTML = "";
      const names = normalizeNames(namesInput.value.split(/\r?\n/));

      for (const name of names) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        option.selected = name === selectedName;
        winnerSelect.appendChild(option);
      }
    }

    function openAdminPanel() {
      namesInput.value = settings.names.join("\n");
      document.querySelector(`input[name="mode"][value="${settings.mode}"]`).checked = true;
      refreshWinnerOptions(settings.fixedWinner);
      adminMessage.textContent = "";
      adminDialog.showModal();
    }

    adminButton.addEventListener("click", () => {
      passwordInput.value = "";
      passwordMessage.textContent = "";
      passwordDialog.showModal();
      setTimeout(() => passwordInput.focus(), 0);
    });

    cancelPassword.addEventListener("click", () => passwordDialog.close());

    passwordForm.addEventListener("submit", event => {
      event.preventDefault();
      if (passwordInput.value !== ADMIN_PASSWORD) {
        passwordMessage.textContent = "Verkeerde wagwoord.";
        passwordInput.select();
        return;
      }
      passwordDialog.close();
      openAdminPanel();
    });

    namesInput.addEventListener("input", () => refreshWinnerOptions(winnerSelect.value));
    cancelAdmin.addEventListener("click", () => adminDialog.close());

    adminForm.addEventListener("submit", event => {
      event.preventDefault();
      const names = normalizeNames(namesInput.value.split(/\r?\n/));
      const mode = document.querySelector('input[name="mode"]:checked')?.value || "random";

      if (names.length < 2) {
        adminMessage.textContent = "Voer asseblief ten minste twee unieke name in.";
        return;
      }

      const fixedWinner = names.includes(winnerSelect.value) ? winnerSelect.value : names[0];
      settings = { names, mode, fixedWinner };
      saveSettings();
      angle = 0;
      result.textContent = "";
      updateModeIndicator();
      drawWheel();
      adminDialog.close();
    });

    resetButton.addEventListener("click", () => {
      settings = structuredClone(DEFAULTS);
      saveSettings();
      namesInput.value = settings.names.join("\n");
      document.querySelector('input[name="mode"][value="random"]').checked = true;
      refreshWinnerOptions(settings.fixedWinner);
      adminMessage.textContent = "Standaardinstellings is herstel. Klik Stoor om toe te pas.";
    });

    spinButton.addEventListener("click", spin);
    updateModeIndicator();
    drawWheel();
  </script>
</body>
</html>
